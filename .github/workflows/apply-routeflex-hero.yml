name: Apply RouteFlex Hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hero:
    if: ${{ !contains(github.event.head_commit.message, 'Apply cinematic RouteFlex hero') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cinematic hero
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          css = Path('style.css')
          html = index.read_text()
          styles = css.read_text()

          old = '''    <section class="hero">
      <div>
        <p class="eyebrow">VAN DRIVER ROUTE PLANNER</p>
        <h1>Get the route.<br><span>Get moving.</span></h1>
        <p class="hero-copy">
          Enter your start and delivery postcodes. RouteFlex validates them,
          orders the stops and draws the road route for you.
        </p>
      </div>
      <div class="hero-icon" aria-hidden="true">
        <img src="assets/routeflex-van.svg" alt="Modern delivery van" width="220" height="130">
      </div>
    </section>'''

          new = '''    <section class="hero hero-image" aria-label="RouteFlex van route planner">
      <img class="hero-image-art" src="assets/routeflex-hero.jpg" alt="RouteFlex delivery van driving on a road">
    </section>'''

          if 'assets/routeflex-hero.jpg' not in html and old in html:
              html = html.replace(old, new)
              index.write_text(html)

          marker = '.hero-image-art {'
          if marker not in styles:
              styles += '''\n\n/* Cinematic RouteFlex hero */\n.hero.hero-image {\n  padding: 0;\n  min-height: 0;\n  aspect-ratio: 16 / 7;\n  background: #080b0e;\n  border-radius: 24px;\n  overflow: hidden;\n}\n\n.hero-image-art {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  object-position: center;\n}\n\n@media (max-width: 700px) {\n  .hero.hero-image { aspect-ratio: 16 / 9; }\n  .hero-image-art { object-position: 62% center; }\n}\n'''
              css.write_text(styles)
          PY

      - name: Commit hero change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet && exit 0
          git commit -m "Apply cinematic RouteFlex hero"
          git push
