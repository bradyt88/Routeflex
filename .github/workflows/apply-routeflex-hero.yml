name: Apply RouteFlex V1 polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'Apply RouteFlex V1 polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V1 presentation polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          css = Path('style.css')
          html = index.read_text()
          styles = css.read_text()

          old_hero = '''    <section class="hero">
      <div>
        <p class="eyebrow">VAN DRIVER ROUTE PLANNER</p>
        <h1>Get the route.<br><span>Get moving.</span></h1>
        <p class="hero-copy">
          Enter your start and delivery postcodes. RouteFlex validates them,
          orders the stops and draws the road route for you.
        </p>
      </div>
      <div class="hero-icon" aria-hidden="true">
        <img src="assets/routeflex-van.svg" alt="Modern delivery van" width="220" height="130">
      </div>
    </section>'''

          new_hero = '''    <section class="hero hero-image" aria-label="RouteFlex van route planner">
      <img class="hero-image-art" src="assets/routeflex-hero.jpg" alt="RouteFlex delivery van driving on a road"
           onerror="this.onerror=null; this.src='assets/routeflex-van.svg'; this.classList.add('hero-fallback');">
      <div class="hero-image-overlay">
        <p class="eyebrow">VAN DRIVER ROUTE PLANNER</p>
        <h1>Get the route.<br><span>Get moving.</span></h1>
        <p class="hero-copy">Plan multi-stop van routes quickly, then take the route with you in Driver Mode.</p>
      </div>
    </section>'''

          if 'assets/routeflex-hero.jpg' not in html and old_hero in html:
              html = html.replace(old_hero, new_hero)

          html = html.replace('V1 PROTOTYPE', 'V1 BETA')
          html = html.replace('Route planner prototype for van drivers', 'Multi-stop route planner for UK van drivers')
          html = html.replace('<title>RouteFlex — Van Route Planner</title>', '<title>RouteFlex — UK Van Route Planner</title>')
          html = html.replace('<span>RouteFlex V1</span>', '<span>RouteFlex V1 Beta</span>')
          index.write_text(html)

          marker = '/* Cinematic RouteFlex hero */'
          if marker not in styles:
              styles += '''

/* Cinematic RouteFlex hero */
.hero.hero-image {
  position: relative;
  padding: 0;
  min-height: 0;
  aspect-ratio: 16 / 7;
  background: #080b0e;
  border-radius: 24px;
  overflow: hidden;
}

.hero-image-art {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.hero-image-art.hero-fallback {
  object-fit: contain;
  object-position: right center;
  width: 42%;
  left: auto;
  opacity: .9;
  padding: 24px;
}

.hero-image-overlay {
  position: relative;
  z-index: 2;
  width: min(58%, 650px);
  min-height: 100%;
  padding: clamp(24px, 4vw, 42px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(90deg, rgba(8,11,14,.97) 0%, rgba(8,11,14,.84) 68%, rgba(8,11,14,0) 100%);
}

.hero-image-overlay .hero-copy {
  max-width: 560px;
}

@media (max-width: 700px) {
  .hero.hero-image { aspect-ratio: 16 / 9; }
  .hero-image-overlay {
    width: 78%;
    padding: 22px;
    background: linear-gradient(90deg, rgba(8,11,14,.97) 0%, rgba(8,11,14,.78) 78%, rgba(8,11,14,0) 100%);
  }
  .hero-image-art { object-position: 62% center; }
  .hero-image-art.hero-fallback { width: 48%; padding: 12px; }
}
'''
              css.write_text(styles)
          PY

      - name: Commit V1 polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet && exit 0
          git commit -m "Apply RouteFlex V1 polish"
          git push
